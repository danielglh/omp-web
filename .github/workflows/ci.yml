name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per PR head at a time; never cancel main-branch runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-and-test:
    name: check-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Matches the engines floor in package.json and the lockfile version.
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint + typecheck (biome + tsc)
        run: bun run check

      - name: Server E2E + web unit tests
        run: bun run test
