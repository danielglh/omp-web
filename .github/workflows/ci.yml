name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per PR head at a time; never cancel main-branch runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-and-test:
    name: check-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Matches the engines floor in package.json and the lockfile version.
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint + typecheck (biome + tsc)
        run: bun run check

      # Coverage gates: thresholds are a ratchet — only ever raised.
      # (`=` syntax is required: space-separated numbers parse as test filters.)
      - name: Tests with coverage gates
        run: |
          set -e
          cd server && bun test --coverage --coverage-threshold=93
          cd ../web && bun test --coverage --coverage-threshold=90

  e2e:
    name: e2e (playwright, mock host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Serves the built app — the e2e suite drives it, not the vite dev server.
      - name: Build
        run: bun run build

      - name: Install Playwright browser
        run: cd e2e && bunx playwright install --with-deps chromium

      - name: Run e2e suite
        run: bun run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
